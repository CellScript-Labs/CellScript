name: cellscript-registry-testnet

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cellscript_registry_testnet
      POSTGRES_USER: cellscript_registry_testnet
      POSTGRES_PASSWORD: ${REGISTRY_TESTNET_DB_PASSWORD:?REGISTRY_TESTNET_DB_PASSWORD is required}
    volumes:
      - registry-testnet-postgres:/var/lib/postgresql/data
    networks: [registry-testnet-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellscript_registry_testnet -d cellscript_registry_testnet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]

  object-store-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:101 /objects && find /objects -type d -exec chmod 2750 '{}' ';' && find /objects -type f -exec chmod 0640 '{}' ';'"]
    volumes:
      - registry-testnet-objects:/objects
    restart: "no"
    security_opt: [no-new-privileges:true]

  api:
    image: ${REGISTRY_API_IMAGE:-cellscript-registry-api:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      object-store-init: { condition: service_completed_successfully }
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://cellscript_registry_testnet:${REGISTRY_TESTNET_DB_PASSWORD}@postgres:5432/cellscript_registry_testnet
      REGISTRY_OBJECTS_DIR: /objects
      REGISTRY_ADMIN_TOKEN: ${REGISTRY_TESTNET_ADMIN_TOKEN:?REGISTRY_TESTNET_ADMIN_TOKEN is required}
      REGISTRY_ORIGIN: ${REGISTRY_TESTNET_ORIGIN:-https://api.testnet.registry.cellscript.dev}
      STATIC_REGISTRY_ORIGIN: ${STATIC_REGISTRY_TESTNET_ORIGIN:-https://objects.testnet.registry.cellscript.dev}
      CKB_RPC_URL: ${CKB_TESTNET_RPC_URL:-https://testnet.ckb.dev/rpc}
      CKB_RPC_MAX_RESPONSE_BYTES: "8388608"
      CKB_MIN_CONFIRMATIONS: "4"
      REGISTRY_TYPE_SCRIPT_JSON: ${REGISTRY_TESTNET_TYPE_SCRIPT_JSON:-}
      REGISTRY_TYPE_SCRIPT_CELL_DEP_JSON: ${REGISTRY_TESTNET_TYPE_SCRIPT_CELL_DEP_JSON:-}
      REGISTRY_COMMITMENT_LOCK_SCRIPT_JSON: ${REGISTRY_TESTNET_COMMITMENT_LOCK_SCRIPT_JSON:-}
      REGISTRY_COMMITMENT_LOCK_CELL_DEP_JSON: ${REGISTRY_TESTNET_COMMITMENT_LOCK_CELL_DEP_JSON:-}
      REGISTRY_REPRODUCER_POLICY_JSON: ${REGISTRY_REPRODUCER_POLICY_JSON:-}
      CKB_REGISTRY_SCAN_MAX_CELLS: "1000"
      ENVIRONMENT: testnet-sandbox
      REGISTRY_ENVIRONMENT: testnet-sandbox
      MAX_INCOMING_BODY_BYTES: "7340032"
      MAX_JSON_BODY_BYTES: "6291456"
      MAX_SNAPSHOT_BYTES: "5242880"
      REQUIRE_REGISTRY_VERIFIER_READY: "true"
      REGISTRY_VERIFIER_SHARED_HEARTBEAT: /objects/.health/verifier-ready
      REGISTRY_VERIFIER_HEARTBEAT_MAX_AGE_SECONDS: "120"
      VIRTUAL_HOST: ${REGISTRY_TESTNET_API_HOST:-api.testnet.registry.cellscript.dev}
      VIRTUAL_PORT: "8787"
    expose: ["8787"]
    volumes:
      - registry-testnet-objects:/objects
    networks: [registry-testnet-internal, stack-network]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  verifier:
    image: ${REGISTRY_VERIFIER_IMAGE:-cellscript-registry-verifier:latest}
    build:
      context: ${CELLSCRIPT_REGISTRY_SOURCE_ROOT:-../../..}
      dockerfile: services/registry-api/Dockerfile.verifier
    restart: unless-stopped
    init: true
    depends_on:
      api: { condition: service_started }
      postgres: { condition: service_healthy }
      object-store-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://cellscript_registry_testnet:${REGISTRY_TESTNET_DB_PASSWORD}@postgres:5432/cellscript_registry_testnet
      REGISTRY_OBJECTS_DIR: /objects
      STATIC_REGISTRY_ORIGIN: ${STATIC_REGISTRY_TESTNET_ORIGIN:-https://objects.testnet.registry.cellscript.dev}
      CELLSCRIPT_REGISTRY_API_URL: ${REGISTRY_TESTNET_ORIGIN:-https://api.testnet.registry.cellscript.dev}
      ENVIRONMENT: testnet-sandbox
      REGISTRY_VERIFIER_POLL_INTERVAL_MS: "2000"
      REGISTRY_VERIFIER_JOB_TIMEOUT_SECONDS: "240"
      REGISTRY_VERIFIER_LEASE_SECONDS: "300"
      REGISTRY_VERIFIER_HEALTH_FILE: /tmp/registry-verifier-ready
      REGISTRY_VERIFIER_SHARED_HEARTBEAT: /objects/.health/verifier-ready
    volumes:
      - registry-testnet-objects:/objects
    networks: [registry-testnet-internal, stack-network]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  static-registry:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      object-store-init: { condition: service_completed_successfully }
    environment:
      VIRTUAL_HOST: ${STATIC_REGISTRY_TESTNET_HOST:-objects.testnet.registry.cellscript.dev}
      VIRTUAL_PORT: "8080"
    expose: ["8080"]
    volumes:
      - registry-testnet-objects:/srv/registry:ro
      - ./registry-static.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [stack-network]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=4m
    security_opt: [no-new-privileges:true]

volumes:
  registry-testnet-postgres:
  registry-testnet-objects:

networks:
  registry-testnet-internal:
    internal: true
  stack-network:
    external: true
    name: stack-network
