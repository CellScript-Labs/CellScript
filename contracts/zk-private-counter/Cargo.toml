[package]
name = "cellscript-zk-private-counter"
version = "0.32.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT"

[workspace]

[dependencies]
anyhow = "1.0"
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-relations = "=0.5.1"
ark-r1cs-std = "=0.5.0"
ark-serialize = "=0.5.0"
ark-snark = "=0.5.1"
ark-std = { version = "=0.5.0", features = ["getrandom"] }
blake2b-ref = "=0.3.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
cellscript = { path = "../.." }
ckb-testtool = "=1.1.1"
tempfile = "3"
ckb-jsonrpc-types = "1.0.0"
ckb-types = "1.0.0"
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
wait-timeout = "0.2"
hex-literal = "0.4"
