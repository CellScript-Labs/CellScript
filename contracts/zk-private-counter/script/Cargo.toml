[package]
name = "cellscript-counter-lifecycle"
version = "0.32.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
[workspace]
[[bin]]
name = "cellscript-counter-lifecycle"
path = "src/main.rs"
test = false
bench = false
[[bin]]
name = "cellscript-counter-migratable-lifecycle"
path = "src/migratable.rs"
test = false
bench = false
[[bin]]
name = "cellscript-counter-config"
path = "src/config.rs"
test = false
bench = false
[dependencies]
ckb-std = { version = "=1.1.0", default-features = false, features = ["allocator", "ckb-types", "type-id"] }
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = false
