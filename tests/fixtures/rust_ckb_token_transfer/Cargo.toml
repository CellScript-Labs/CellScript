[workspace]
resolver = "3"

[package]
name = "rust-ckb-token-transfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
ckb-std = { version = "=1.1.0", default-features = false }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = false
