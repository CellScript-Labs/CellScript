[package]
name = "cellscript-fiber-adapter"
version = "0.22.0"
edition = "2021"
rust-version = "1.92.0"
publish = false
description = "No-profile Fiber interoperability adapter for structurally compatible CellScript fungible Type Scripts"
license = "MIT"

[[bin]]
name = "cellscript-fiber"
path = "src/bin/cellscript-fiber.rs"

[dependencies]
anyhow = "1.0"
cellscript = { path = "../.." }
cellscript-ckb-adapter = { path = "../cellscript-ckb-adapter" }
camino = "1.1"
ckb-types = "1.0.0"
clap = { version = "=4.5.49", features = ["derive"] }
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
