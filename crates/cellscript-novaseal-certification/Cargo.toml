[package]
name = "cellscript-novaseal-certification"
version = "0.33.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Native NovaSeal profile evidence reconstruction and certification"
include = ["Cargo.toml", "src/**", "tests/resources/**", "README.md"]

[dependencies]
cellscript-canonical-json = { version = "=0.33.0-alpha.1", path = "../cellscript-canonical-json" }
serde_json = "1.0"
sha2 = "0.10"
blake2b_simd = "1.0"
hex = "0.4"
toml = "0.8"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
